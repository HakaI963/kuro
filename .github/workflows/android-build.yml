name: Android Build

on:
  push:
    branches:
      - kuro/step-6-fluxlinux-integration
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules for termux-x11 native deps)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android platform, build tools, NDK and CMake
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865" "ndk;27.0.12077973" "cmake;3.22.1"
          yes | sdkmanager --licenses || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/ndk/29.0.14206865/ndk-build" --version || true
          cmake --version || true

      - name: Install native build prerequisites (termux-x11 CMake)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison patch
          python3 --version
          ar --version | head -n 1

      - name: Assemble host bootstrap (bootstrap.tar from tracked .debs)
        run: |
          python3 scripts/assemble_bootstrap.py --package-name com.ivarna.fluxlinux --mode full
          bash scripts/verify_bootstrap.sh com.ivarna.fluxlinux

      - name: Gradle configure check (no resolution)
        run: |
          set +e
          ./gradlew help --stacktrace > /tmp/g-help.log 2>&1
          code=$?
          if [ "$code" -ne "0" ]; then
            python3 -c "
          t = open('/tmp/g-help.log', errors='replace').read()
          i = t.find('* What went wrong:')
          head = (t[i:i+1500] if i >= 0 else t[:1500])
          j = t.find('Caused by:')
          caused = (t[j:j+800] if j >= 0 else '')
          msg = (head + '%0A...' + caused).replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
          print('::error::gradle-configure failed:%0A' + msg)
          "
            exit "$code"
          fi

      - name: Gradle resolve main classpath (dependency check)
        run: |
          set +e
          ./gradlew :app:dependencies --configuration ivarnaDebugRuntimeClasspath --stacktrace > /tmp/g-resolve.log 2>&1
          code=$?
          if [ "$code" -ne "0" ]; then
            python3 -c "
          t = open('/tmp/g-resolve.log', errors='replace').read()
          tail = t[-3500:].replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
          print('::error::gradle-resolve failed:%0A' + tail)
          "
            exit "$code"
          fi

      - name: Gradle resolve test classpath (dependency check)
        run: ./gradlew :app:dependencies --configuration ivarnaDebugUnitTestRuntimeClasspath --stacktrace

      - name: Compile app Kotlin (ivarna debug)
        run: |
          set +e
          ./gradlew :app:compileIvarnaDebugKotlin --stacktrace > /tmp/g-compile-app.log 2>&1
          code=$?
          if [ "$code" -ne "0" ]; then
            python3 -c "
          lines = open('/tmp/g-compile-app.log', errors='replace').read().splitlines()
          keep = [l for l in lines if l.startswith('e: ') or 'FAILED' in l or 'error:' in l.lower() or l.startswith('* What went wrong') or 'Caused by:' in l][:60]
          msg = chr(10).join(keep)[-3500:].replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
          print('::error::compile-app failed:%0A' + msg)
          "
            exit "$code"
          fi

      - name: Compile test Kotlin (ivarna debug)
        run: |
          set +e
          ./gradlew :app:compileIvarnaDebugUnitTestKotlin --stacktrace > /tmp/g-compile-test.log 2>&1
          code=$?
          if [ "$code" -ne "0" ]; then
            python3 -c "
          lines = open('/tmp/g-compile-test.log', errors='replace').read().splitlines()
          keep = [l for l in lines if l.startswith('e: ') or 'FAILED' in l or 'error:' in l.lower() or l.startswith('* What went wrong') or 'Caused by:' in l][:60]
          msg = chr(10).join(keep)[-3500:].replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
          print('::error::compile-test failed:%0A' + msg)
          "
            exit "$code"
          fi

      - name: Unit tests group 1 (install/desktop/gpu/data)
        run: |
          set +e
          ./gradlew :app:testIvarnaDebugUnitTest --tests "com.ivarna.fluxlinux.core.install.*" --tests "com.ivarna.fluxlinux.core.desktop.*" --tests "com.ivarna.fluxlinux.core.gpu.*" --tests "com.ivarna.fluxlinux.core.data.*" --stacktrace > /tmp/g-test-1.log 2>&1
          code=$?
          if [ "$code" -ne "0" ]; then
            python3 -c "
          lines = open('/tmp/g-test-1.log', errors='replace').read().splitlines()
          keep = [l for l in lines if l.startswith('e: ') or 'FAILED' in l or 'error:' in l.lower() or l.startswith('* What went wrong') or 'Caused by:' in l][:60]
          msg = chr(10).join(keep)[-3500:].replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
          print('::error::tests-1 failed:%0A' + msg)
          "
            exit "$code"
          fi

      - name: Unit tests group 2 (legacy/root/chroot/proot/utils)
        run: |
          set +e
          ./gradlew :app:testIvarnaDebugUnitTest --tests "com.ivarna.fluxlinux.core.legacy.*" --tests "com.ivarna.fluxlinux.core.root.*" --tests "com.ivarna.fluxlinux.core.chroot.*" --tests "com.ivarna.fluxlinux.core.proot.*" --tests "com.ivarna.fluxlinux.core.utils.*" --stacktrace > /tmp/g-test-2.log 2>&1
          code=$?
          if [ "$code" -ne "0" ]; then
            python3 -c "
          lines = open('/tmp/g-test-2.log', errors='replace').read().splitlines()
          keep = [l for l in lines if l.startswith('e: ') or 'FAILED' in l or 'error:' in l.lower() or l.startswith('* What went wrong') or 'Caused by:' in l][:60]
          msg = chr(10).join(keep)[-3500:].replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
          print('::error::tests-2 failed:%0A' + msg)
          "
            exit "$code"
          fi

      - name: Unit tests group 3 (terminal)
        run: |
          set +e
          ./gradlew :app:testIvarnaDebugUnitTest --tests "com.ivarna.fluxlinux.core.terminal.*" --stacktrace > /tmp/g-test-3.log 2>&1
          code=$?
          if [ "$code" -ne "0" ]; then
            python3 -c "
          lines = open('/tmp/g-test-3.log', errors='replace').read().splitlines()
          keep = [l for l in lines if l.startswith('e: ') or 'FAILED' in l or 'error:' in l.lower() or l.startswith('* What went wrong') or 'Caused by:' in l][:60]
          msg = chr(10).join(keep)[-3500:].replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
          print('::error::tests-3 failed:%0A' + msg)
          "
            exit "$code"
          fi

      - name: Unit tests group 4 (ui)
        run: |
          set +e
          ./gradlew :app:testIvarnaDebugUnitTest --tests "com.ivarna.fluxlinux.ui.*" --stacktrace > /tmp/g-test-4.log 2>&1
          code=$?
          if [ "$code" -ne "0" ]; then
            python3 -c "
          lines = open('/tmp/g-test-4.log', errors='replace').read().splitlines()
          keep = [l for l in lines if l.startswith('e: ') or 'FAILED' in l or 'error:' in l.lower() or l.startswith('* What went wrong') or 'Caused by:' in l][:60]
          msg = chr(10).join(keep)[-3500:].replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
          print('::error::tests-4 failed:%0A' + msg)
          "
            exit "$code"
          fi

      - name: Build ivarna debug APK
        run: |
          set +e
          ./gradlew :app:assembleIvarnaDebug --stacktrace > /tmp/g-assemble.log 2>&1
          code=$?
          if [ "$code" -ne "0" ]; then
            python3 -c "
          lines = open('/tmp/g-assemble.log', errors='replace').read().splitlines()
          keep = [l for l in lines if l.startswith('e: ') or 'FAILED' in l or 'error:' in l.lower() or l.startswith('* What went wrong') or 'Caused by:' in l][:60]
          msg = chr(10).join(keep)[-3500:].replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
          print('::error::assemble failed:%0A' + msg)
          "
            exit "$code"
          fi

      - name: Upload ivarna debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kuro-ivarna-debug-apk
          path: app/build/outputs/apk/ivarna/debug/*.apk
