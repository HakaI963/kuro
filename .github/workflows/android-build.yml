name: Android Build

on:
  push:
    branches:
      - kuro/step-6-fluxlinux-integration
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules for termux-x11 native deps)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android platform, build tools, NDK and CMake
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;29.0.14206865" "cmake;3.22.1"
          yes | sdkmanager --licenses || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/ndk/29.0.14206865/ndk-build" --version || true
          cmake --version || true

      - name: Install native build prerequisites (termux-x11 CMake)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison patch
          python3 --version
          ar --version | head -n 1

      - name: Assemble host bootstrap (bootstrap.tar from tracked .debs)
        run: |
          python3 scripts/assemble_bootstrap.py --package-name com.ivarna.fluxlinux --mode full
          bash scripts/verify_bootstrap.sh com.ivarna.fluxlinux

      - name: Run unit tests (ivarna debug)
        run: ./gradlew :app:testIvarnaDebugUnitTest --stacktrace

      - name: Build ivarna debug APK
        run: ./gradlew :app:assembleIvarnaDebug --stacktrace

      - name: Upload ivarna debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kuro-ivarna-debug-apk
          path: app/build/outputs/apk/ivarna/debug/*.apk
