// KURO-PATCH vs upstream termux/termux-app@v0.118.2
// (third_party/termux-app/terminal-view):
// - compileSdkVersion / minSdkVersion / targetSdkVersion literals
//   (compileSdk 35, minSdk 26 to match Kuro). Upstream reads them from root
//   project.properties, which Kuro does not have.
// - Dependency ':terminal-emulator' renamed to ':termux-terminal-emulator'
//   (Kuro module name).
// - Nothing else changed. No Java source file is modified.
apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace "com.termux.view"
    compileSdk 35

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        api project(":termux-terminal-emulator")
    }

    defaultConfig {
        minSdk 26
        targetSdk 35
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = "sources"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.default
                groupId = 'com.termux'
                artifactId = 'terminal-view'
                version = '0.118.0'
                artifact(sourceJar)
            }
        }
    }
}
