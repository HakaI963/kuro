// KURO-PATCH vs upstream termux/termux-app@v0.118.2
// (third_party/termux-app/terminal-emulator):
// - compileSdkVersion / minSdkVersion / targetSdkVersion / ndkVersion literals
//   (compileSdk 35, minSdk 26 to match Kuro; NDK 27.0.12077973 to match CI).
//   Upstream reads them from root project.properties, which Kuro does not have.
// -abiFilters narrowed to arm64-v8a + x86_64 (proot runs on arm64; x86_64
//   keeps emulator builds working). Upstream also builds x86/armeabi-v7a.
// - Nothing else changed. No Java/C source file is modified.
apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace "com.termux.emulator"

    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdk 26
        targetSdk 35

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

tasks.withType(Test) {
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.0"
    testImplementation "junit:junit:4.13.2"
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = "sources"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.default
                groupId = 'com.termux'
                artifactId = 'terminal-emulator'
                version = '0.118.0'
                artifact(sourceJar)
            }
        }
    }
}
